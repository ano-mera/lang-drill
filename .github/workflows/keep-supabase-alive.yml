name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 * * *' # Every day at 00:00 UTC
  workflow_dispatch: # Manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping production app homepage
        env:
          APP_URL: https://lang-drill.vercel.app/
        run: |
          STATUS=$(curl -sL -o /tmp/response.txt -w '%{http_code}' --retry 3 --retry-delay 10 \
            -H "User-Agent: GitHub-Actions-KeepAlive" \
            "$APP_URL")
          echo "HTTP $STATUS"
          echo "Response size: $(wc -c < /tmp/response.txt) bytes"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 400 ]; then
            exit 1
          fi
