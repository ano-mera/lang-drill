name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours (4x per day)
  workflow_dispatch: # Manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query keep_alive table (counts as DB activity)
        env:
          SUPABASE_URL: https://ggwuevlehtjrugkydwab.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          STATUS=$(curl -s -o /tmp/res.json -w '%{http_code}' --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/keep_alive?select=id" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY")
          echo "REST HTTP $STATUS, body: $(cat /tmp/res.json)"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            exit 1
          fi
          # Verify response is the expected single-row array
          if ! grep -q '"id":1' /tmp/res.json; then
            echo "Unexpected response — keep_alive row not found"
            exit 1
          fi
