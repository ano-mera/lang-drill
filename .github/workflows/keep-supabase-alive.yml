name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours (4x per day)
  workflow_dispatch: # Manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping production app (simulates user traffic)
        env:
          APP_URL: https://lang-drill.vercel.app/
        run: |
          STATUS=$(curl -sL -o /tmp/app.html -w '%{http_code}' --retry 3 --retry-delay 10 \
            -H "User-Agent: GitHub-Actions-KeepAlive" \
            "$APP_URL")
          echo "App HTTP $STATUS, $(wc -c < /tmp/app.html) bytes"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 400 ]; then
            exit 1
          fi

      - name: Ping Supabase auth directly (belt-and-suspenders)
        env:
          SUPABASE_URL: https://ggwuevlehtjrugkydwab.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          STATUS=$(curl -s -o /tmp/auth.json -w '%{http_code}' --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/auth/v1/health" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY")
          echo "Auth HTTP $STATUS, $(cat /tmp/auth.json)"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            exit 1
          fi
